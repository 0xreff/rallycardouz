<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desert demo - kontradouz</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f0a; }
    canvas { display: block; }
    #hud { position: fixed; left: 16px; bottom: 14px; color: #ffe3c4; font: 12px/1.5 system-ui, sans-serif; opacity: .75; pointer-events: none; text-shadow: 0 1px 2px #0008; }
    #hud b { color: #bfe3ff; }
    #fps { position: fixed; left: 16px; top: 12px; color: #ffe3c4; font: 12px monospace; opacity: .7; pointer-events: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="fps"></div>
  <div id="hud"><b>W/S</b> throttle/brake &middot; <b>A/D</b> steer &middot; <b>Space</b> brake &middot; <b>P</b> auto-drive &middot; <b>H</b> hide panel</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
